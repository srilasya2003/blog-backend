name: Backend deployment

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-django-secret-key-for-github-actions-tests-2026
      DJANGO_DEBUG: "True"
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        env:
  RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
run: |
  test -n "$RENDER_DEPLOY_HOOK" || {
    echo "::error::Render deploy hook secret is missing."
    exit 1
  }
  echo "Deploy hook is set; requesting deployment."
  curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"