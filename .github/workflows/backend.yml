name: Backend deployment

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-django-secret-key-for-github-actions-tests-2026
      DJANGO_DEBUG: "True"
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test


  deploy-development:
    name: Deploy development to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEV_DEPLOY_HOOK is empty or unavailable to the development environment."
            exit 1
          fi

          case "$RENDER_DEPLOY_HOOK" in
            https://api.render.com/deploy/*) ;;
            *)
              echo "::error::The development deploy hook does not have the expected Render URL format."
              exit 1
              ;;
          esac

          echo "Development deploy hook is configured; requesting Render deployment."
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"